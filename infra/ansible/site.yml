---
- name: Baseline hardening for every node
  hosts: k3s_cluster
  become: true
  roles:
    - hardening

- name: Install the k3s control plane
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Join the workers to the cluster
  hosts: k3s_agents
  become: true
  roles:
    - k3s_agent
