---
- name: Read the join token from the server
  ansible.builtin.slurp:
    src: "{{ k3s_token_file }}"
  delegate_to: "{{ groups['k3s_server'][0] }}"
  run_once: true
  become: true
  no_log: true
  register: k3s_node_token

- name: Create the k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the k3s agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart k3s-agent

- name: Download the k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install k3s agent
  ansible.builtin.command: "{{ k3s_install_script_path }}"
  args:
    creates: "{{ k3s_agent_uninstall_script }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: agent

- name: Make sure the k3s-agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started

- name: Wait for this worker to be Ready
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl wait
    --for=condition=Ready node/{{ inventory_hostname }} --timeout=10s
  delegate_to: "{{ groups['k3s_server'][0] }}"
  register: k3s_worker_ready
  until: k3s_worker_ready.rc == 0
  retries: "{{ k3s_ready_retries }}"
  delay: "{{ k3s_ready_delay }}"
  changed_when: false
  when: not ansible_check_mode

- name: Label this node as a worker
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl label node {{ inventory_hostname }}
    node-role.kubernetes.io/worker=worker --overwrite
  delegate_to: "{{ groups['k3s_server'][0] }}"
  register: k3s_worker_label
  changed_when: "'not labeled' not in k3s_worker_label.stdout"
  when: not ansible_check_mode
